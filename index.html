<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
        />
        <title>3D World</title>
        <link rel="stylesheet" href="./src/index.css" />
        <!-- Fetch the physics engine while the scripts load, rather than after -->
        <link
            rel="preload"
            href="/lib/ammo/ammo.wasm.wasm"
            as="fetch"
            type="application/wasm"
            crossorigin
        />
        <!-- A classic script, as its loader finds the .wasm file next to itself. It must come
             before main.js, which uses the Ammo global it defines. -->
        <script src="/lib/ammo/ammo.wasm.js" defer></script>
        <script type="module" src="./src/main.js"></script>
    </head>
    <body>
        <div id="container"></div>
    </body>
</html>
